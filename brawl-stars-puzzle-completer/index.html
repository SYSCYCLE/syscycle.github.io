<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Brawl Stars - Etkinlik Sona Erdi</title>
	<script src="https://cdn.tailwindcss.com"></script>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&family=Rubik:wght@600;800;900&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
	<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
	<script>
		tailwind.config = {
			darkMode: 'class',
			theme: {
				extend: {
					fontFamily: {
						brawl: ['Fredoka',
							'Rubik',
							'sans-serif'],
						sans: ['Rubik',
							'sans-serif'],
					},
					colors: {
						brawl: {
							purple: '#1c0a35',
							darkPurple: '#0d041a',
							yellow: '#ffd000',
							red: '#ff2a2a',
							green: '#28d800'
						}
					}
				}
			}
		}
	</script>

	<style>
		.text-brawl-stroke {
			-webkit-text-stroke: 3px #000000;
			paint-order: stroke fill;
		}
		.text-brawl-shadow {
			text-shadow: 4px 5px 0px #000000;
		}
		.brawl-border {
			border: 5px solid #000000;
		}
		.brawl-button {
			transition: transform 0.1s ease, box-shadow 0.1s ease;
			box-shadow: 0 7px 0 #000;
		}
		.brawl-button:active {
			transform: translateY(4px);
			box-shadow: 0 3px 0 #000;
		}
		.bs-stripes {
			background-color: #0d041a;
			background-image: repeating-linear-gradient(
			-45deg,
			rgba(255, 255, 255, 0.03),
			rgba(255, 255, 255, 0.03) 25px,
			transparent 25px,
			transparent 50px
			);
		}
		@keyframes bounceSlow {
			0%, 100% {
				transform: translateY(0);
			}
			50% {
				transform: translateY(-10px);
			}
		}
		.animate-bounce-slow {
			animation: bounceSlow 2s infinite ease-in-out;
		}
	</style>
</head>
<body class="bg-brawl-darkPurple text-white font-sans antialiased bs-stripes min-h-screen flex items-center justify-center p-4 overflow-hidden relative select-none">

	<canvas id="starCanvas" class="absolute inset-0 pointer-events-none z-0 opacity-50"></canvas>

	<main class="relative z-10 w-full max-w-lg bg-gradient-to-b from-brawl-purple to-brawl-darkPurple rounded-3xl brawl-border p-8 text-center shadow-2xl flex flex-col items-center gap-6">

		<div class="relative animate-bounce-slow">
			<div class="w-24 h-24 bg-brawl-red rounded-3xl brawl-border flex items-center justify-center text-white text-5xl shadow-xl rotate-3">
				<i class="fa-solid fa-lock"></i>
			</div>
			<div class="absolute -bottom-2 -right-2 bg-brawl-yellow text-black font-brawl text-xs px-3 py-1 rounded-full brawl-border font-extrabold uppercase">
				KAPANDI
			</div>
		</div>

		<div class="space-y-2">
			<h1 class="font-brawl font-extrabold text-4xl sm:text-5xl text-brawl-yellow text-brawl-stroke text-brawl-shadow tracking-wider leading-tight">
				ETKİNLİK SONA ERDİ
			</h1>
		</div>

	</main>

	<script>
		const canvas = document.getElementById('starCanvas');
		const ctx = canvas.getContext('2d');
		let stars = [];

		function resizeCanvas() {
			canvas.width = window.innerWidth;
			canvas.height = window.innerHeight;
			stars = Array.from({
				length: 30
			}, () => ({
					x: Math.random() * canvas.width,
					y: Math.random() * canvas.height,
					size: Math.random() * 3 + 1,
					speedY: (Math.random() * 0.3 + 0.1) * -1,
					color: ['#ffd000', '#ff2a2a', '#ffffff'][Math.floor(Math.random() * 3)]
				}));
		}

		function animateStars() {
			ctx.clearRect(0, 0, canvas.width, canvas.height);
			stars.forEach(star => {
				star.y += star.speedY;
				if (star.y < 0) star.y = canvas.height;
				ctx.fillStyle = star.color;
				ctx.beginPath();
				ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
				ctx.fill();
			});
			requestAnimationFrame(animateStars);
		}

		window.addEventListener('resize', resizeCanvas);
		resizeCanvas();
		animateStars();
	</script>
</body>
</html>
